version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-lab-backend
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./atlas_lab.db
      - OIDC_ENABLED=false
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=atlas-lab
      - KEYCLOAK_ADMIN_USER=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/v1/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - atlas-lab-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-lab-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - atlas-lab-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: atlas-lab-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - atlas-lab-network

  postgres:
    image: postgres:16-alpine
    container_name: atlas-lab-postgres
    environment:
      - POSTGRES_DB=atlas_lab
      - POSTGRES_USER=atlas_lab
      - POSTGRES_PASSWORD=atlas_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_lab -d atlas_lab"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - atlas-lab-network

volumes:
  backend-data:
  keycloak-data:
  postgres-data:

networks:
  atlas-lab-network:
    driver: bridge