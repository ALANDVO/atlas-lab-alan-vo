name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: backend
          ENVIRONMENT: test
          DEBUG: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          OIDC_ENABLED: "false"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: atlas-lab-backend:latest
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: atlas-lab-frontend:latest
          load: true

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker build -t atlas-lab-backend:latest ./backend
          docker build -t atlas-lab-frontend:latest ./frontend

      - name: Start services
        run: |
          docker network create atlas-lab-network
          docker run -d --name postgres \
            --network atlas-lab-network \
            -e POSTGRES_DB=atlas_lab \
            -e POSTGRES_USER=atlas_lab \
            -e POSTGRES_PASSWORD=atlas_lab \
            postgres:16-alpine
          sleep 5
          docker run -d --name keycloak \
            --network atlas-lab-network \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HEALTH_ENABLED=true \
            quay.io/keycloak/keycloak:25.0 start-dev --import-realm
          sleep 30
          docker run -d --name backend \
            --network atlas-lab-network \
            -e ENVIRONMENT=test \
            -e DEBUG=true \
            -e DATABASE_URL=postgresql+asyncpg://atlas_lab:atlas_lab@postgres:5432/atlas_lab \
            -e OIDC_ENABLED=true \
            -e OIDC_ISSUER_URL=http://keycloak:8080/realms/atlas-lab \
            -e OIDC_CLIENT_ID=atlas-lab-frontend \
            -e OIDC_CLIENT_SECRET=atlas-lab-frontend-secret-change-in-production \
            -e KEYCLOAK_URL=http://keycloak:8080 \
            -e KEYCLOAK_REALM=atlas-lab \
            -p 8000:8000 \
            atlas-lab-backend:latest
          sleep 10
          docker run -d --name frontend \
            --network atlas-lab-network \
            -p 80:80 \
            atlas-lab-frontend:latest

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/v1/health; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to become healthy"
          docker logs backend
          exit 1

      - name: Test health endpoint
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health | jq -e '.status == "ok"'

      - name: Test frontend
        run: |
          curl -sf http://127.0.0.1/ | grep -q "Atlas Lab"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f backend frontend keycloak postgres 2>/dev/null || true
          docker network rm atlas-lab-network 2>/dev/null || true